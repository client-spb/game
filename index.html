<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Космический Защитник 3D</title>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script src="/static/games/max-games-sdk.js?v=2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0a0a1a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }
    @media (min-width: 600px) {
      #app {
        height: 100vh;
        aspect-ratio: 9 / 16;
        width: auto;
        margin: 0 auto;
        box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
      }
      body {
        background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
      }
    }
    #game-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 100%);
      z-index: 100;
      transition: opacity 0.3s;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    .screen-title {
      font-size: 32px;
      font-weight: 900;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
    }
    .screen-subtitle {
      font-size: 14px;
      color: #8899aa;
      margin-bottom: 30px;
    }
    .menu-btn {
      width: 240px;
      height: 50px;
      margin: 8px 0;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
    }
    .btn-primary:active {
      transform: scale(0.95);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.2);
    }
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 50;
    }
    .hud-left, .hud-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-item {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
    }
    .hud-icon {
      width: 24px;
      height: 24px;
      fill: #00d4ff;
    }
    .hud-value {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .health-bar {
      width: 150px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff4444 0%, #ff8844 100%);
      transition: width 0.3s;
      border-radius: 6px;
    }
    .pause-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 51;
      backdrop-filter: blur(5px);
    }
    .pause-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(10px);
    }
    .overlay.hidden {
      display: none;
    }
    .result-title {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .result-win {
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
    }
    .result-lose {
      color: #ff4444;
      text-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
    }
    .result-score {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
      margin: 20px 0;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }
    .result-label {
      font-size: 14px;
      color: #8899aa;
      margin-bottom: 5px;
    }
    .lb-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 300;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .lb-overlay.hidden {
      display: none;
    }
    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .lb-title {
      font-size: 24px;
      font-weight: 900;
      color: #00d4ff;
      text-transform: uppercase;
    }
    .lb-close {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-close svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }
    .lb-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 10px;
      margin-bottom: 8px;
    }
    .lb-row.top-1 {
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    .lb-row.top-2 {
      background: rgba(192, 192, 192, 0.15);
      border: 1px solid rgba(192, 192, 192, 0.3);
    }
    .lb-row.top-3 {
      background: rgba(205, 127, 50, 0.15);
      border: 1px solid rgba(205, 127, 50, 0.3);
    }
    .lb-medal {
      width: 32px;
      text-align: center;
      font-weight: 900;
      font-size: 16px;
      flex-shrink: 0;
    }
    .lb-medal.gold {
      color: #ffd700;
      font-size: 20px;
    }
    .lb-medal.silver {
      color: #c0c0c0;
      font-size: 18px;
    }
    .lb-medal.bronze {
      color: #cd7f32;
      font-size: 18px;
    }
    .lb-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
    }
    .lb-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .lb-name {
      flex: 1;
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
    }
    .lb-score {
      font-weight: 900;
      font-size: 16px;
      flex-shrink: 0;
      color: #00d4ff;
    }
    .lb-empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.6;
      font-size: 14px;
      color: #8899aa;
    }
    .wave-indicator {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #00d4ff;
      backdrop-filter: blur(5px);
      z-index: 45;
    }
    .wave-indicator.hidden {
      display: none;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 240px;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    .settings-label {
      color: #fff;
      font-size: 14px;
    }
    .toggle-switch {
      width: 50px;
      height: 28px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle-switch.on {
      background: #00d4ff;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-switch.on::after {
      transform: translateX(22px);
    }
  </style>
</head>
<body>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>

  <script>
    // === GAME CONFIGURATION ===
    const GAME_NAME = 'space_defender_3d';
    const SAVE_KEY = 'space_defender_save_v1';
    
    // === SAVE SYSTEM ===
    const SAVE = {
      sound: true,
      vibration: true,
      highScore: 0,
      unlockedLevels: 1
    };
    
    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) Object.assign(SAVE, JSON.parse(raw));
      } catch (e) {}
    }
    
    function persist() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
      } catch (e) {}
    }
    
    loadSave();
    
    // === SDK INITIALIZATION ===
    if (window.WebApp && window.WebApp.ready) {
      try { window.WebApp.ready(); } catch (e) {}
    }
    
    if (window.GameSDK && GameSDK.init) {
      try {
        GameSDK.init(GAME_NAME, function () {
          console.log('[Game] GameSDK initialized:', GAME_NAME);
        });
      } catch (e) {
        console.warn('[Game] GameSDK init error:', e);
      }
    }
    
    // === AUDIO ENGINE ===
    const FX = (() => {
      let ctx = null;
      function audio() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(freq, dur, type, vol, delay, slide) {
        const ac = audio();
        if (!ac || !SAVE.sound) return;
        const t = ac.currentTime + (delay || 0);
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(t); osc.stop(t + dur + 0.05);
      }
      function noise(dur, vol, delay) {
        const ac = audio();
        if (!ac || !SAVE.sound) return;
        const t = ac.currentTime + (delay || 0);
        const bufferSize = ac.sampleRate * dur;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noiseSrc = ac.createBufferSource();
        noiseSrc.buffer = buffer;
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        const gain = ac.createGain();
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        noiseSrc.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        noiseSrc.start(t);
      }
      return {
        unlock() { audio(); },
        click() { tone(800, 0.05, 'sine', 0.06); },
        shoot() { tone(600, 0.1, 'square', 0.08, 0, 200); noise(0.1, 0.05, 0); },
        hit() { tone(300, 0.15, 'sawtooth', 0.1, 0, 150); },
        explosion() { noise(0.3, 0.15, 0); tone(100, 0.3, 'square', 0.1, 0, 50); },
        powerup() { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.1, 'sine', 0.1, i * 0.08)); },
        win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.14, i * 0.11)); },
        lose() { [330, 262, 208, 165].forEach((f, i) => tone(f, 0.2, 'sawtooth', 0.1, i * 0.16)); },
        wave() { [880, 1175, 1480].forEach((f, i) => tone(f, 0.15, 'sine', 0.1, i * 0.1)); }
      };
    })();
    
    // === GAME STATE ===
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'menu';
    let score = 0;
    let health = 100;
    let timeLeft = 60;
    let wave = 1;
    let lastTime = 0;
    let enemies = [];
    let bullets = [];
    let particles = [];
    let player = { x: 0, y: 0, angle: 0 };
    let touchStart = { x: 0, y: 0 };
    let isTouching = false;
    
    // === RESIZE CANVAS ===
    function resize() {
      const container = document.getElementById('game-container');
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      ctx.scale(dpr, dpr);
      canvas.style.width = container.clientWidth + 'px';
      canvas.style.height = container.clientHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
    
    // === SCREEN MANAGEMENT ===
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      if (id) document.getElementById(id).classList.remove('hidden');
    }
    
    function hideHUD() {
      document.getElementById('hud').style.display = 'none';
      document.getElementById('pause-btn').style.display = 'none';
      document.getElementById('wave-indicator').classList.add('hidden');
    }
    
    function showHUD() {
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('pause-btn').style.display = 'flex';
    }
    
    // === PARTICLES ===
    function createParticle(x, y, color, speed) {
      const angle = Math.random() * Math.PI * 2;
      const vel = Math.random() * speed;
      particles.push({
        x, y,
        vx: Math.cos(angle) * vel,
        vy: Math.sin(angle) * vel,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        color,
        size: 2 + Math.random() * 3
      });
    }
    
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    
    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    
    // === ENEMY SPAWNING ===
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      const w = canvas.width / (Math.min(2, window.devicePixelRatio || 1));
      const h = canvas.height / (Math.min(2, window.devicePixelRatio || 1));
      
      switch(side) {
        case 0: x = Math.random() * w; y = -30; break;
        case 1: x = w + 30; y = Math.random() * h; break;
        case 2: x = Math.random() * w; y = h + 30; break;
        case 3: x = -30; y = Math.random() * h; break;
      }
      
      const speed = 1 + wave * 0.3 + Math.random() * 0.5;
      const hp = 1 + Math.floor(wave / 3);
      
      enemies.push({
        x, y,
        speed,
        hp,
        maxHp: hp,
        angle: 0,
        type: Math.random() > 0.8 ? 'fast' : 'normal'
      });
    }
    
    // === GAME LOOP ===
    function startGame() {
      score = 0;
      health = 100;
      timeLeft = 60;
      wave = 1;
      enemies = [];
      bullets = [];
      particles = [];
      player.x = canvas.width / (Math.min(2, window.devicePixelRatio || 1)) / 2;
      player.y = canvas.height / (Math.min(2, window.devicePixelRatio || 1)) / 2;
      
      updateHUD();
      showHUD();
      showScreen(null);
      gameState = 'playing';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }
    
    function updateHUD() {
      document.getElementById('score-display').textContent = score;
      document.getElementById('health-fill').style.width = health + '%';
      document.getElementById('time-display').textContent = Math.ceil(timeLeft);
      document.getElementById('wave-indicator').textContent = 'Волна ' + wave;
    }
    
    function gameLoop(now) {
      if (gameState !== 'playing') return;
      
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      
      // Update time
      timeLeft -= dt;
      if (timeLeft <= 0) {
        wave++;
        timeLeft = 30 + wave * 10;
        health = Math.min(100, health + 20);
        FX.wave();
        if (SAVE.vibration && window.WebApp && window.WebApp.HapticFeedback) {
          window.WebApp.HapticFeedback.notificationOccurred('success');
        }
      }
      
      // Update player position
      if (isTouching) {
        const dx = touchStart.x - player.x;
        const dy = touchStart.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          player.x += dx * 5 * dt;
          player.y += dy * 5 * dt;
        }
        player.angle = Math.atan2(dy, dx);
      }
      
      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += Math.cos(b.angle) * b.speed;
        b.y += Math.sin(b.angle) * b.speed;
        b.life -= dt;
        if (b.life <= 0 || b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) {
          bullets.splice(i, 1);
        }
      }
      
      // Update enemies
      const w = canvas.width / (Math.min(2, window.devicePixelRatio || 1));
      const h = canvas.height / (Math.min(2, window.devicePixelRatio || 1));
      
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 0) {
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;
        }
        
        // Collision with player
        if (dist < 25) {
          health -= 10;
          FX.hit();
          if (SAVE.vibration && window.WebApp && window.WebApp.HapticFeedback) {
            window.WebApp.HapticFeedback.impactOccurred('medium');
          }
          enemies.splice(i, 1);
          
          for (let j = 0; j < 10; j++) {
            createParticle(e.x, e.y, '#ff4444', 5);
          }
          
          if (health <= 0) {
            endGame(false);
            return;
          }
          continue;
        }
        
        // Collision with bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const bdx = b.x - e.x;
          const bdy = b.y - e.y;
          const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
          
          if (bdist < 20) {
            e.hp--;
            bullets.splice(j, 1);
            
            for (let k = 0; k < 5; k++) {
              createParticle(e.x, e.y, '#00d4ff', 3);
            }
            
            if (e.hp <= 0) {
              score += e.type === 'fast' ? 20 : 10;
              FX.explosion();
              if (SAVE.vibration && window.WebApp && window.WebApp.HapticFeedback) {
                window.WebApp.HapticFeedback.impactOccurred('heavy');
              }
              
              for (let k = 0; k < 15; k++) {
                createParticle(e.x, e.y, '#ff8800', 6);
              }
              
              enemies.splice(i, 1);
            }
            break;
          }
        }
      }
      
      updateParticles(dt);
      
      // Render
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, w, h);
      
      // Draw grid
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.1)';
      ctx.lineWidth = 1;
      const gridSize = 50;
      for (let x = 0; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      
      // Draw player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      
      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(-15, -12);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-15, 12);
      ctx.closePath();
      ctx.fill();
      
      ctx.fillStyle = 'rgba(0, 212, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(-10, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      // Draw bullets
      bullets.forEach(b => {
        ctx.fillStyle = '#00ff88';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(0, 255, 136, 0.3)';
        ctx.beginPath();
        ctx.arc(b.x - Math.cos(b.angle) * 10, b.y - Math.sin(b.angle) * 10, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Draw enemies
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        
        if (e.type === 'fast') {
          ctx.fillStyle = '#ff4444';
          ctx.beginPath();
          ctx.moveTo(0, -15);
          ctx.lineTo(12, 8);
          ctx.lineTo(-12, 8);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#ff8800';
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#ffcc00';
          ctx.beginPath();
          ctx.arc(0, 0, 8, 0, Math.PI * 2);
          ctx.fill();
        }
        
        ctx.restore();
      });
      
      drawParticles();
      
      updateHUD();
      requestAnimationFrame(gameLoop);
    }
    
    function shoot() {
      if (gameState !== 'playing') return;
      
      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        angle: player.angle,
        speed: 500,
        life: 2
      });
      
      FX.shoot();
    }
    
    function endGame(win) {
      gameState = 'result';
      hideHUD();
      
      const titleEl = document.getElementById('result-title');
      titleEl.textContent = win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
      titleEl.className = 'result-title ' + (win ? 'result-win' : 'result-lose');
      
      document.getElementById('result-score').textContent = score;
      
      if (score > SAVE.highScore) {
        SAVE.highScore = score;
        persist();
      }
      
      // Send score to leaderboard
      if (window.GameSDK && typeof GameSDK.saveScore === 'function') {
        GameSDK.saveScore(score).then(res => {
          if (res && res.ok && res.is_new_record) {
            toast('Новый рекорд в рейтинге!');
          }
        }).catch(e => {
          console.warn('[Game] saveScore error:', e);
        });
      }
      
      showScreen('result-screen');
      
      if (win) {
        FX.win();
      } else {
        FX.lose();
      }
    }
    
    function toast(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fff;padding:20px 30px;border-radius:15px;font-size:16px;font-weight:700;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.5);';
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 2000);
    }
    
    // === LEADERBOARD ===
    async function openLeaderboard() {
      document.getElementById('lb-overlay').classList.remove('hidden');
      const list = document.getElementById('lb-list');
      list.innerHTML = '<div class="lb-empty">Загрузка...</div>';
      
      if (window.GameSDK && GameSDK.getLeaderboard) {
        try {
          const res = await GameSDK.getLeaderboard(20);
          if (res && res.ok && res.leaderboard) {
            renderLeaderboard(res.leaderboard);
          } else {
            renderLeaderboard([]);
          }
        } catch (e) {
          renderLeaderboard([]);
        }
      } else {
        renderLeaderboard([]);
      }
    }
    
    function renderLeaderboard(players) {
      const list = document.getElementById('lb-list');
      list.innerHTML = '';
      
      if (!players || players.length === 0) {
        list.innerHTML = '<div class="lb-empty">Пока нет рекордов. Будьте первым!</div>';
        return;
      }
      
      players.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'lb-row';
        if (i === 0) row.classList.add('top-1');
        else if (i === 1) row.classList.add('top-2');
        else if (i === 2) row.classList.add('top-3');
        
        const medal = document.createElement('div');
        medal.className = 'lb-medal';
        if (i === 0) { medal.textContent = '1'; medal.classList.add('gold'); }
        else if (i === 1) { medal.textContent = '2'; medal.classList.add('silver'); }
        else if (i === 2) { medal.textContent = '3'; medal.classList.add('bronze'); }
        else medal.textContent = '#' + (i + 1);
        row.appendChild(medal);
        
        const avatar = document.createElement('div');
        avatar.className = 'lb-avatar';
        const displayName = p.name || p.nickname || 'Игрок';
        const initial = displayName.charAt(0).toUpperCase();
        if (p.photo_url) {
          const img = document.createElement('img');
          img.src = p.photo_url;
          img.alt = '';
          img.onerror = function() { this.remove(); avatar.textContent = initial; };
          avatar.appendChild(img);
        } else {
          avatar.textContent = initial;
        }
        row.appendChild(avatar);
        
        const name = document.createElement('div');
        name.className = 'lb-name';
        name.textContent = displayName;
        row.appendChild(name);
        
        const scoreEl = document.createElement('div');
        scoreEl.className = 'lb-score';
        scoreEl.textContent = p.score;
        row.appendChild(scoreEl);
        
        list.appendChild(row);
      });
    }
    
    // === SHARE ===
    function shareResult() {
      const link = 'https://max.ru/channel_igroteka_max';
      const text = `Я набрал ${score} очков в Космическом Защитнике 3D! играй прямо в Максе без скачиваний ${link}`;
      
      try {
        if (window.WebApp && window.WebApp.shareContent) {
          window.WebApp.shareContent({ text });
          return;
        }
      } catch (e) {}
      
      try {
        if (navigator.share) {
          navigator.share({ text });
          return;
        }
      } catch (e) {}
      
      try {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          toast('Ссылка скопирована');
        }
      } catch (e) {}
    }
    
    // === EVENT LISTENERS ===
    document.getElementById('start-btn').addEventListener('click', () => {
      FX.unlock();
      FX.click();
      startGame();
    });
    
    document.getElementById('leaderboard-btn').addEventListener('click', () => {
      FX.click();
      openLeaderboard();
    });
    
    document.getElementById('lb-close').addEventListener('click', () => {
      FX.click();
      document.getElementById('lb-overlay').classList.add('hidden');
    });
    
    document.getElementById('settings-btn').addEventListener('click', () => {
      FX.click();
      showScreen('settings-screen');
    });
    
    document.getElementById('back-settings-btn').addEventListener('click', () => {
      FX.click();
      showScreen('menu-screen');
    });
    
    document.getElementById('sound-toggle').addEventListener('click', function() {
      FX.click();
      this.classList.toggle('on');
      SAVE.sound = this.classList.contains('on');
      persist();
    });
    
    document.getElementById('vibration-toggle').addEventListener('click', function() {
      FX.click();
      this.classList.toggle('on');
      SAVE.vibration = this.classList.contains('on');
      persist();
    });
    
    document.getElementById('privacy-btn').addEventListener('click', () => {
      FX.click();
      if (window.GameSDK && GameSDK.openConsentSettings) {
        GameSDK.openConsentSettings();
      }
    });
    
    document.getElementById('pause-btn').addEventListener('click', () => {
      FX.click();
      gameState = 'paused';
      showScreen('pause-screen');
    });
    
    document.getElementById('resume-btn').addEventListener('click', () => {
      FX.click();
      gameState = 'playing';
      showScreen(null);
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
      FX.click();
      startGame();
    });
    
    document.getElementById('menu-btn').addEventListener('click', () => {
      FX.click();
      gameState = 'menu';
      showScreen('menu-screen');
    });
    
    document.getElementById('play-again-btn').addEventListener('click', () => {
      FX.click();
      startGame();
    });
    
    document.getElementById('share-btn').addEventListener('click', () => {
      FX.click();
      shareResult();
    });
    
    document.getElementById('result-menu-btn').addEventListener('click', () => {
      FX.click();
      gameState = 'menu';
      showScreen('menu-screen');
    });
    
    // Touch/Mouse controls
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      isTouching = true;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width / (Math.min(2, window.devicePixelRatio || 1));
      const scaleY = canvas.height / rect.height / (Math.min(2, window.devicePixelRatio || 1));
      touchStart.x = (e.clientX - rect.left) * scaleX;
      touchStart.y = (e.clientY - rect.top) * scaleY;
      shoot();
    });
    
    canvas.addEventListener('pointermove', (e) => {
      if (!isTouching || gameState !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width / (Math.min(2, window.devicePixelRatio || 1));
      const scaleY = canvas.height / rect.height / (Math.min(2, window.devicePixelRatio || 1));
      touchStart.x = (e.clientX - rect.left) * scaleX;
      touchStart.y = (e.clientY - rect.top) * scaleY;
    });
    
    canvas.addEventListener('pointerup', () => {
      isTouching = false;
    });
    
    canvas.addEventListener('pointerleave', () => {
      isTouching = false;
    });
    
    // Auto-fire when holding
    setInterval(() => {
      if (isTouching && gameState === 'playing') {
        shoot();
      }
    }, 200);
    
    // Visibility change
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && gameState === 'playing') {
        gameState = 'paused';
        showScreen('pause-screen');
      }
    });
    
    // Initialize sound on first interaction
    document.addEventListener('click', () => FX.unlock(), { once: true });
  </script>
</body>
